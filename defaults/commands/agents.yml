# Background Claude agents. They run headless in the PR's worktree, outlive gh-prs, and
# push when done. Their stdout must be claude's stream-json (shown in the agent column).
#
# They run unattended with only the tools in --allowedTools (plus your Claude settings' allow
# rules). env -u drops any ANTHROPIC_API_KEY so they use your claude.ai login; remove it to
# bill an API key instead. Prompts: prompts/context.md, then the command's prompt_file.
- key: cc
  name: get it mergeable
  worktree: true
  background: true
  run: &agent >-
    env -u ANTHROPIC_API_KEY claude -p "$(cat "$PR_PROMPT_FILE")" --session-id "$PR_SESSION_ID" --model sonnet
    --output-format stream-json --verbose
    --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(gh:*),Bash(npm:*),Bash(npx:*),Bash(pnpm:*),Bash(yarn:*),Bash(node:*),Bash(go:*),Bash(make:*),Bash(python3:*),Bash(pytest:*),Bash(uv:*),Bash(ls:*)"
  prompt_file: get-mergeable.md
- key: cf
  name: fix CI
  worktree: true
  background: true
  run: *agent
  prompt_file: fix-ci.md
- key: ca
  name: address comments
  worktree: true
  background: true
  run: *agent
  prompt_file: address-comments.md
- key: cr
  name: rebase
  worktree: true
  background: true
  run: *agent
  prompt_file: rebase.md
# Manage a PR until it merges: every 15 minutes, resolve conflicts, rebase when behind and
# address new review comments. It runs Claude's /loop, so it stays alive between rounds
# (◷ in the agent column). It stops when the PR merges or closes, after 8h, or at $10.
- key: cm
  name: manage
  worktree: true
  background: true
  timeout: 8h
  run: >-
    env -u ANTHROPIC_API_KEY claude -p "/loop $(cat "$PR_PROMPT_FILE")" --session-id "$PR_SESSION_ID" --model sonnet
    --output-format stream-json --verbose --max-budget-usd 10
    --allowedTools "ScheduleWakeup,Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(gh:*),Bash(npm:*),Bash(npx:*),Bash(pnpm:*),Bash(yarn:*),Bash(node:*),Bash(go:*),Bash(make:*),Bash(python3:*),Bash(pytest:*),Bash(uv:*),Bash(ls:*)"
  prompt_file: manage.md
# Ask Claude anything about the PR, in a new agent session.
- key: ci
  name: ask Claude
  worktree: true
  background: true
  input: Ask Claude about this PR
  run: *agent
  prompt_file: ask.md
# Reply to the PR's last agent: resumes its session with your message. A manage loop that's
# still running is stopped first, and carries on its rounds after handling the reply.
- key: cy
  name: reply to agent
  worktree: true
  background: true
  agent_session: true
  timeout: 8h
  input: Reply to Claude
  run: >-
    env -u ANTHROPIC_API_KEY claude -p "$(cat "$PR_PROMPT_FILE")" --resume "$PR_AGENT_SESSION" --model sonnet
    --output-format stream-json --verbose --max-budget-usd 10
    --allowedTools "ScheduleWakeup,Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(gh:*),Bash(npm:*),Bash(npx:*),Bash(pnpm:*),Bash(yarn:*),Bash(node:*),Bash(go:*),Bash(make:*),Bash(python3:*),Bash(pytest:*),Bash(uv:*),Bash(ls:*)"
  prompt_file: reply.md
# Open the PR's last agent session in your opener to take over from it.
- key: ct
  name: take over agent
  worktree: true
  terminal: true
  agent_session: true
  run: claude --resume "$PR_AGENT_SESSION"

# Stops the agent running on the PR, a manage loop included, with everything it started.
- key: cx
  name: stop agent
  builtin: stop_agent
  confirm: true
