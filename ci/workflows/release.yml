# Tags and releases every merged PR. Not enabled: see ci/README.md first.
#
# The version goes up by the PR's label: `major`, `minor`, or a patch by default. The release
# carries the gh extension binaries (`gh extension install/upgrade` downloads them). The macOS
# app needs a Mac to build, so it's attached from your machine: `make app-release`.
name: release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write # push the tag, create the release

concurrency:
  group: release # one at a time, so two merges can't take the same version
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0 # tags, to find the last version
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Next version
        id: version
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          last=$(git tag --list 'v*' --sort=-v:refname | head -1)
          IFS=. read -r major minor patch <<< "${last#v}"
          major=${major:-0} minor=${minor:-0} patch=${patch:-0}
          case " $LABELS " in
            *" major "*) major=$((major + 1)) minor=0 patch=0 ;;
            *" minor "*) minor=$((minor + 1)) patch=0 ;;
            *) patch=$((patch + 1)) ;;
          esac
          echo "tag=v$major.$minor.$patch" >> "$GITHUB_OUTPUT"
      - name: Build the gh extension binaries
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} \
              go build -trimpath -ldflags "-s -w" -o "dist/gh-prs_${TAG}_${target%/*}-${target#*/}" .
          done
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TITLE: ${{ github.event.pull_request.title }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git tag "$TAG" "${{ github.event.pull_request.merge_commit_sha }}"
          git push origin "$TAG"
          gh release create "$TAG" dist/* --title "$TAG" --notes "$TITLE (#$NUMBER)"
