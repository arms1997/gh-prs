# Tags and releases every merged PR. Not enabled: see ci/README.md first.
#
# It runs scripts/release.sh, the same script as `make release PR=<n>` on your machine: the
# version goes up by the PR's label (`major`, `minor`, or a patch by default), and the release
# carries the gh extension binaries (`gh extension install/upgrade` downloads them). The macOS
# app needs a Mac to build, so it's attached from your machine: `make app-release`.
name: release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write # push the release commit and tag, create the release

concurrency:
  group: release # one at a time, so two merges can't take the same version
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0 # tags, to find the last version
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: scripts/release.sh "$PR"
