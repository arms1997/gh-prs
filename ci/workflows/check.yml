# Runs `make check` on every PR and every push to main. Not enabled: GitHub only runs workflows
# under .github/workflows/. See ci/README.md for what this costs before moving it there.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR cancels the run still going for the old one.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOFLAGS: -tags=webkit2_41 # Wails on Ubuntu 24.04, which only ships WebKitGTK 4.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: GTK and WebKit headers (the desktop package compiles against them on Linux)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: npm ci
        working-directory: desktop/frontend
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: make check
