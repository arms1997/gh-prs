<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a6cf2"/>
      <stop offset="1" stop-color="#5b2fb8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".18"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <filter id="glyph" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2a0f66" flood-opacity=".35"/>
    </filter>
  </defs>
  <!-- Apple's macOS grid: an 824px rounded square centred on the 1024 canvas. -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>
  <g filter="url(#glyph)" fill="none" stroke="#fff" stroke-width="56" stroke-linecap="round">
    <path d="M392 330 V694"/>
    <path d="M392 400 C392 500 470 540 570 540"/>
    <g fill="#fff" stroke="none">
      <circle cx="392" cy="300" r="74"/>
      <circle cx="392" cy="724" r="74"/>
      <circle cx="642" cy="540" r="74"/>
    </g>
  </g>
</svg>
